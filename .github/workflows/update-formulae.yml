name: Update Formulae

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-formulae:
    name: Check & Bump Upstream Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check & Update Formulae
        id: updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update-formulae.py

      - name: Detect Changes
        id: git_diff
        run: |
          if git diff --quiet Formula/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "All formulae are up to date." >> $GITHUB_STEP_SUMMARY
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "### 🚀 Updated Formulae" >> $GITHUB_STEP_SUMMARY
            git diff --name-only Formula/ >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit & Push Changes
        if: steps.git_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "chore(formulae): automated daily bump for new upstream releases"
          git push origin main
